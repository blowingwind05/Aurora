name: Build Aurora for macOS

on:
  push:
    branches: [main, aurora-native-streaming-integration]
    paths:
      - '.github/workflows/build-macos.yml'
      - '.gitmodules'
      - 'desktop/**'
      - 'tests/Check-NativeDesktopPackage.py'
  workflow_dispatch:
    inputs:
      architecture:
        description: Mac architecture
        type: choice
        options: [arm64, x64, both]
        default: arm64

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}-${{ inputs.architecture || 'arm64' }}
  cancel-in-progress: true

jobs:
  build:
    name: macOS ${{ matrix.architecture }}
    runs-on: ${{ matrix.architecture == 'arm64' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        architecture: ${{ fromJSON(inputs.architecture == 'both' && '["arm64","x64"]' || inputs.architecture == 'x64' && '["x64"]' || '["arm64"]') }}
    env:
      AURORA_ARCHITECTURE: ${{ matrix.architecture }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.3'
          host: mac
          target: desktop
          arch: clang_64

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Sunshine build dependencies
        run: |
          brew install cmake pkgconf icu4c@78 openssl@3 opus
          python -m venv "$RUNNER_TEMP/aurora-host-python"
          "$RUNNER_TEMP/aurora-host-python/bin/python" -m pip install 'Jinja2==3.1.6'
          echo "$RUNNER_TEMP/aurora-host-python/bin" >> "$GITHUB_PATH"

      - name: Verify Qt session chrome
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          QT_QUICK_CONTROLS_STYLE: Fusion
          QML_DISABLE_DISK_CACHE: '1'
        run: |
          "$QT_ROOT_DIR/bin/qmltestrunner" -input tests/qt-ui/tst_MacStreamChrome.qml -o -,txt
          "$QT_ROOT_DIR/bin/qmltestrunner" -input tests/qt-ui/tst_MacConnectedTitleBar.qml -o -,txt

      - name: Build and sign Aurora.app
        env:
          AURORA_VERIFY_COCOA_TOOLBAR: '1'
        run: |
          pwsh -NoProfile -File ./desktop/tailnet/Build-Tailnet.ps1 -Runtime "osx-$AURORA_ARCHITECTURE" -OutputDirectory "$RUNNER_TEMP/aurora-tailnet" -RunTests
          pwsh -NoProfile -File ./desktop/packaging/Build-Mac.ps1 -Architecture "$AURORA_ARCHITECTURE" -Qmake "$QT_ROOT_DIR/bin/qmake" -TailscaleDirectory "$RUNNER_TEMP/aurora-tailnet"

      - name: Verify the packaged launcher and runtimes
        run: |
          zip="dist/Aurora-macOS-${AURORA_ARCHITECTURE}-integrated.zip"
          (cd dist && shasum -a 256 -c "$(basename "$zip").sha256")
          check="$(mktemp -d)"
          ditto -x -k "$zip" "$check"
          app="$check/Aurora.app"
          codesign --verify --deep --strict "$app"
          python3 tests/Check-NativeDesktopPackage.py "$app"
          clean_env=(/usr/bin/env -i "HOME=$HOME" "TMPDIR=${TMPDIR:-/tmp}" PATH=/usr/bin:/bin QT_QPA_PLATFORM=cocoa)
          launcher="$app/Contents/MacOS/Aurora"
          test -x "$launcher"
          test -f "$app/Contents/Resources/ui/desktop/app/qml/Main.qml"
          "${clean_env[@]}" "$launcher" --check-native
          runtime="$app/Contents/MacOS/AuroraStream"
          test -x "$runtime"
          test "$("${clean_env[@]}" "$runtime" --aurora-runtime-info)" = aurora-stream/1
          test "$("${clean_env[@]}" "$runtime" --aurora-gamestream-relay-info)" = aurora-gamestream-relay/1
          python3 desktop/upstream/Prepare-EngineSource.py verify moonlight \
            "$app/Contents/Resources/ThirdParty/Moonlight/SOURCE.txt"
          tailnet="$app/Contents/MacOS/AuroraTailnet"
          test -x "$tailnet"
          test "$("${clean_env[@]}" "$tailnet" --aurora-runtime-info)" = aurora-tailnet/1
          test -f "$app/Contents/Resources/Tailscale/licenses/SOURCE.txt"
          host="$app/Contents/Helpers/AuroraHost.app"
          test -x "$host/Contents/MacOS/AuroraHost"
          test "$("${clean_env[@]}" "$host/Contents/MacOS/AuroraHost" --aurora-runtime-info)" = aurora-host/1
          codesign --verify --deep --strict "$host"
          dock_icon="desktop/Assets/Aurora-mac-Dock-77.icns"
          cmp "$dock_icon" "$app/Contents/Resources/Aurora.icns"
          cmp "$dock_icon" "$app/Contents/Resources/moonlight.icns"
          cmp "$dock_icon" "$host/Contents/Resources/sunshine.icns"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$host/Contents/Info.plist")" = org.aurora-remote.desktop.host
          python3 desktop/upstream/Prepare-EngineSource.py verify sunshine \
            "$host/Contents/Resources/licenses/SOURCE.txt"

          native_arch="$AURORA_ARCHITECTURE"
          if [[ "$native_arch" == x64 ]]; then
            native_arch=x86_64
          fi
          test "$(uname -m)" = "$native_arch"
          for binary in "$launcher" "$runtime" "$tailnet" "$host/Contents/MacOS/AuroraHost"; do
            test "$(lipo -archs "$binary")" = "$native_arch"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Aurora-macOS-${{ matrix.architecture }}-integrated
          path: |
            dist/Aurora-macOS-${{ matrix.architecture }}-integrated.zip
            dist/Aurora-macOS-${{ matrix.architecture }}-integrated.zip.sha256
          if-no-files-found: error
          compression-level: 0

  attest:
    name: Attest macOS artifacts
    needs: build
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Aurora-macOS-*-integrated
          path: artifacts

      - name: Generate build provenance
        uses: actions/attest@v4
        with:
          subject-path: 'artifacts/Aurora-macOS-*-integrated/Aurora-macOS-*-integrated.zip'
