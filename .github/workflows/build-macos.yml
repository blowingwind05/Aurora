name: Build Aurora for macOS

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Mac architecture
        type: choice
        options: [arm64, x64, both]
        default: arm64

permissions:
  contents: read

jobs:
  build:
    name: macOS ${{ matrix.architecture }}
    runs-on: ${{ matrix.architecture == 'arm64' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        architecture: ${{ fromJSON(inputs.architecture == 'both' && '["arm64","x64"]' || inputs.architecture == 'x64' && '["x64"]' || '["arm64"]') }}
    env:
      AURORA_ARCHITECTURE: ${{ matrix.architecture }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.3'
          host: mac
          target: desktop
          arch: clang_64

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Sunshine build dependencies
        run: |
          brew install node pkgconf icu4c@78 miniupnpc openssl@3 opus
          host_tools="$RUNNER_TEMP/aurora-host-python"
          python -m venv "$host_tools"
          # Sunshine's Boost.Locale 1.89.0 fails to configure with CMake 4.5.
          "$host_tools/bin/python" -m pip install 'cmake==4.3.1' 'Jinja2==3.1.6'
          echo "$host_tools/bin" >> "$GITHUB_PATH"

      - name: Build and sign Aurora.app
        run: |
          cmake --version
          pwsh -NoProfile -File ./desktop/upstream/tsnet/Build-Tailnet.ps1 -Runtime "osx-$AURORA_ARCHITECTURE" -OutputDirectory "$RUNNER_TEMP/aurora-tailnet" -RunTests
          pwsh -NoProfile -File ./desktop/Build-Mac.ps1 -Architecture "$AURORA_ARCHITECTURE" -Qmake "$QT_ROOT_DIR/bin/qmake" -TailscaleDirectory "$RUNNER_TEMP/aurora-tailnet"

      - name: Verify the packaged streamer and host
        run: |
          zip="dist/Aurora-macOS-${AURORA_ARCHITECTURE}-integrated.zip"
          check="$(mktemp -d)"
          ditto -x -k "$zip" "$check"
          app="$check/Aurora.app"
          codesign --verify --deep --strict "$app"
          runtime="$app/Contents/MacOS/AuroraStream"
          test -x "$runtime"
          test "$("$runtime" --aurora-runtime-info)" = aurora-stream/1
          test "$("$runtime" --aurora-gamestream-relay-info)" = aurora-gamestream-relay/1
          tailnet="$app/Contents/MacOS/AuroraTailnet"
          test -x "$tailnet"
          test "$("$tailnet" --aurora-runtime-info)" = aurora-tailnet/1
          test -f "$app/Contents/Resources/Tailscale/licenses/SOURCE.txt"
          host="$app/Contents/Helpers/AuroraHost.app"
          test -x "$host/Contents/MacOS/AuroraHost"
          test "$("$host/Contents/MacOS/AuroraHost" --aurora-runtime-info)" = aurora-host/1
          codesign --verify --deep --strict "$host"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$host/Contents/Info.plist")" = org.aurora-remote.desktop.host
          test -f "$host/Contents/Resources/licenses/SOURCE.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: Aurora-macOS-${{ matrix.architecture }}-integrated
          path: dist/Aurora-macOS-${{ matrix.architecture }}-integrated.zip
          if-no-files-found: error
          compression-level: 0
